workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
    scripts:
      - name: Install deps
        script: npm install
      - name: Build web
        script: npm run build
      - name: Add Android
        script: npx cap add android || true
      - name: Sync
        script: npx cap sync android
      - name: Build APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-workflow:
    name: iOS Build
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      node: 20
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourcompany.daftari
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    integrations:
      app_store_connect: codemagic_api_key
    scripts:
      - name: Install deps
        script: npm install
      - name: Build web
        script: npm run build
      - name: Add iOS
        script: npx cap add ios || true
      - name: Sync
        script: npx cap sync ios
      - name: Pods
        script: |
          cd ios/App
          pod install
      - name: Signing
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
